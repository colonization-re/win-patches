# Check every push; publish the patcher page to GitHub Pages from main.
#
#   https://colonization-re.github.io/win-patches/
#
# What is published is dist/ exactly as committed, after build.py --check has proved it
# matches a fresh build. The page anyone downloads is the file in the repository.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight PR run when the branch is pushed again. Runs on main are never
# cancelled, so a deploy is not killed halfway.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nasm, to re-assemble code sites
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: manifests consistent, generated files current
        run: python3 build.py --check
      - name: the tools still start
        run: |
          python3 patch.py list
          python3 -m py_compile patch.py build.py
      - name: package dist/ for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
